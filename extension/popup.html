<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Calculator</title>
    <style>
        body {
            width: 380px;
            margin: 0;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f8fa;
            color: #111;
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 5px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 900;
            margin: 0 0 5px 0;
            letter-spacing: -0.5px;
        }
        .header-line {
            width: 40px;
            height: 3px;
            background-color: #111;
            margin: 0 auto 10px auto;
            border-radius: 5px;
        }
        .header p {
            font-size: 13px;
            color: #555;
            margin: 0;
            padding: 0 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }
        .card.p-0 { padding: 0; }

        .url-box {
            background: #f8f9fa;
            border: 1px solid #eef0f2;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 13px;
            color: #333;
            margin-bottom: 20px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .speed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .speed-label {
            font-size: 14px;
            font-weight: 600;
        }
        .speed-badge {
            background: #111;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 5px;
            outline: none;
            margin-bottom: 5px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff0000;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        
        .slider-marks {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #888;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 0 5px;
        }

        /* Buton */
        .btn {
            width: 100%;
            padding: 14px;
            background-color: #2d2d2d;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { background-color: #111; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; transform: none; }

        #resultCard {
            display: none;
            text-align: center;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-title {
            font-size: 12px;
            font-weight: 800;
            color: #111;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .huge-time {
            font-size: 42px;
            font-weight: 900;
            color: #000;
            line-height: 1.1;
            letter-spacing: -1px;
            margin-bottom: 15px;
        }
        .stats {
            font-size: 13px;
            font-weight: 600;
            color: #111;
            margin-bottom: 15px;
        }
        .stats span { font-weight: 800; }
        .divider {
            border: none;
            border-top: 1px solid #eee;
            margin: 15px 0;
        }
        .finish-time {
            font-size: 14px;
            font-weight: 700;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .finish-time svg { width: 16px; height: 16px; opacity: 0.7; }
        .red-text { color: #dc3545; font-size: 16px; }

        #manageVideosCard { display: none; overflow: hidden; }
        .manage-header {
            padding: 15px 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .manage-header svg { transition: transform 0.3s; }
        .manage-header.active svg { transform: rotate(180deg); }
        
        .list-container {
            max-height: 0;
            overflow-y: auto;
            transition: max-height 0.3s ease-out;
        }
        .list-container::-webkit-scrollbar { width: 6px; }
        .list-container::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
        
        .video-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-top: 1px solid #f5f5f5;
            gap: 12px;
            cursor: pointer;
        }
        .video-item:hover { background: #fafafa; }
        .video-item input[type="checkbox"] { cursor: pointer; accent-color: #111; width: 16px; height: 16px; }
        .video-item img { width: 64px; border-radius: 6px; object-fit: cover; aspect-ratio: 16/9; }
        .v-title { font-size: 12px; font-weight: 600; color: #111; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; display: block; margin-bottom: 2px;}
        .v-duration { font-size: 11px; color: #666; font-weight: 500;}

        .logo-mark {
            text-align: center;
            margin-top: 15px;
            opacity: 0.5;
        }
        .logo-mark img { width: 24px; border-radius: 50%; }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #777;
            text-decoration: none;
            font-weight: 600;
            padding-bottom: 5px;
            transition: color 0.2s;
        }
        .footer-link:hover {
            color: #111;
            text-decoration: underline;
        }

        .video-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            min-width: 20px;
            width: 20px;
            height: 20px;
            border: 2px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin: 0;
            padding: 0;
            flex-shrink: 0; 
        }

        .video-item input[type="checkbox"]:hover {
            border-color: #888;
        }

        .video-item input[type="checkbox"]:checked {
            background-color: #111;
            border-color: #111;
        }

        .video-item input[type="checkbox"]:checked::after {
            content: '✔';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

    </style>
</head>
<body>
    
    <div class="header">
        <h1>Playlist Length Calculator</h1>
        <div class="header-line"></div>
        <p>Find out the total length of any YouTube playlist instantly.</p>
    </div>

    <div class="card">
        <div class="url-box" id="urlBox">Searching for link...</div>
        
        <div class="speed-header">
            <span class="speed-label">Playback Speed</span>
            <span class="speed-badge" id="speedValue">1.00 x</span>
        </div>
        <input type="range" id="speedRange" min="1" max="5" step="0.25" value="1">
        <div class="slider-marks">
            <span>1x</span><span>2x</span><span>3x</span><span>4x</span><span>5x</span>
        </div>

        <button class="btn" id="calcBtn">Calculate Duration</button>
    </div>

    <div class="card" id="resultCard">
        <div class="result-title">TOTAL DURATION</div>
        <div class="huge-time" id="totalTimeDisplay">0h 0m 0s</div>
        
        <div class="stats">
            Videos: <span id="videoCount">0</span> &nbsp;|&nbsp; 
            Avg: <span id="avgTime">0m 0s</span>
        </div>
        
        <hr class="divider">
        
        <div class="finish-time">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            Finish At: <span class="red-text" id="finishTime">--:--</span>
        </div>
    </div>

    <div class="card p-0" id="manageVideosCard">
        <div class="manage-header" id="listToggle">
            Manage Videos
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <div class="list-container" id="videoListContainer">
            <ul id="videoList" style="list-style:none; padding:0; margin:0;"></ul>
        </div>
    </div>

    <a href="https://ytplaylistcalculator.com" target="_blank" class="footer-link">Open in ytplaylistcalculator.com ↗</a>
    
    <script src="popup.js"></script>
</body>
</html>
